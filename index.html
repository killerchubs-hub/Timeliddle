<!DOCTYPE html>

    .mono { font-family: 'JetBrains Mono', monospace; }
    
    /* CRT Scanline effect overlay */
    .scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 4px, 6px 100%;
    }
  </style>
</head>

    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <button onclick="toggleMenu(true)" class="w-10 h-10 bg-slate-900 border border-slate-700/80 hover:border-amber-400/50 rounded-xl flex items-center justify-center text-amber-400 font-bold text-lg transition-all shadow-md">
          ☰

        <div>

            TIMELINE <span class="text-amber-400">#42</span>
          </h1>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <div class="bg-amber-500/10 border border-amber-500/30 text-amber-300 px-3 py-1 rounded-xl text-xs font-bold mono flex items-center gap-1">
          🔥 <span id="streakCount">1</span>
        </div>
      </div>
    </div>
  </header>

  <!-- MENU OVERLAY MODAL -->
  <div id="menuModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-[#0f1523] border border-slate-700/80 w-full max-w-sm rounded-3xl p-6 space-y-4 shadow-2xl relative">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h2 class="text-lg font-bold tracking-wide text-amber-400">MENU</h2>
        <button onclick="toggleMenu(false)" class="w-8 h-8 bg-slate-800 hover:bg-slate-700 rounded-xl flex items-center justify-center text-slate-300 font-bold">✕</button>
      </div>

      <div class="grid grid-cols-2 gap-3 py-2">
        <button onclick="openModalSection('stats')" class="p-4 bg-slate-900/90 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/40 rounded-2xl text-center space-y-1 transition-all">
          <div class="text-xl">📊</div>
          <div class="text-xs font-bold text-slate-200">Stats</div>
        </button>
        <button onclick="openModalSection('archive')" class="p-4 bg-slate-900/90 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/40 rounded-2xl text-center space-y-1 transition-all">
          <div class="text-xl">🗓️</div>
          <div class="text-xs font-bold text-slate-200">Archive</div>
        </button>
        <button onclick="openModalSection('settings')" class="p-4 bg-slate-900/90 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/40 rounded-2xl text-center space-y-1 transition-all">
          <div class="text-xl">⚙️</div>
          <div class="text-xs font-bold text-slate-200">Settings</div>
        </button>
        <button onclick="openModalSection('faq')" class="p-4 bg-slate-900/90 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/40 rounded-2xl text-center space-y-1 transition-all">
          <div class="text-xl">❓</div>
          <div class="text-xs font-bold text-slate-200">How to Play</div>
        </button>
      </div>

      <div id="modalContentBox" class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800 text-xs text-slate-300 hidden">
        <!-- Dynamic content goes here -->
      </div>
    </div>
  </div>
