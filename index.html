<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TimeLine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/SortableJS/1.15.0/Sortable.min.js"></script>
</head>
<body class="scanlines flex flex-col h-[100dvh]">

  <!-- Header -->
  <header class="border-b border-slate-800/80 p-4 bg-[#0b0f19]/90 backdrop-blur z-40">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <button id="menuBtn" class="w-10 h-10 bg-slate-900 border border-slate-700/80 hover:border-amber-400/50 rounded-xl flex items-center justify-center text-amber-400 font-bold text-lg transition-all shadow-md">
          ☰
        </button>
        <h1 class="text-base font-bold tracking-wider text-white">
          TIMELINE <span id="dailyNumberBadge" class="text-amber-400">#--</span>
        </h1>
      </div>
      <div class="bg-amber-500/10 border border-amber-500/30 text-amber-300 px-3 py-1 rounded-xl text-xs font-bold mono">
        🔥 <span id="streakCount">0</span>
      </div>
    </div>
  </header>

  <!-- Ad Space -->
  <div class="w-full bg-[#07090e] py-2 border-b border-slate-800">
    <div class="ad-banner-container">
      Ad Space (320x50)
    </div>
  </div>

  <!-- Menu Modal -->
  <div id="menuModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-[#0f1523] border border-slate-700/80 w-full max-w-sm rounded-3xl p-6 space-y-4 shadow-2xl relative">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h2 class="text-lg font-bold tracking-wide text-amber-400">MENU</h2>
        <button id="closeMenuBtn" class="w-8 h-8 bg-slate-800 rounded-xl text-slate-300 font-bold">✕</button>
      </div>
      <div class="grid grid-cols-2 gap-3 py-2">
        <button class="p-4 bg-slate-900/90 border border-slate-800 rounded-2xl text-center" onclick="window.location.href='archive.html'">
          <div class="text-xl mb-1">🗓️</div><div class="text-xs font-bold text-slate-200">Archive</div>
        </button>
        <button class="p-4 bg-slate-900/90 border border-slate-800 rounded-2xl text-center" onclick="window.location.href='party.html'">
          <div class="text-xl mb-1">🎮</div><div class="text-xs font-bold text-slate-200">Party Mode</div>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Game Area -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col justify-between relative z-10 overflow-y-auto">
    <div id="gameContainer" class="flex flex-col flex-1 gap-4 py-2">
      <div class="flex justify-between items-center">
        <span class="text-[11px] font-bold text-amber-400 uppercase tracking-widest">Sort: Oldest ➔ Newest</span>
      </div>

      <!-- Card Pool -->
      <div id="cardPool" class="min-h-[140px] p-3 bg-slate-900/80 border border-slate-800 rounded-2xl flex flex-wrap gap-2 content-start shadow-inner">
        <!-- Cards injected via JS -->
      </div>

      <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Timeline Slots</div>

      <!-- Slots -->
      <div class="space-y-2" id="slotContainer">
        <!-- Slots injected via JS -->
      </div>
    </div>

    <!-- Action Button -->
    <button id="actionBtn" disabled class="w-full py-4 mt-4 bg-amber-500 disabled:opacity-30 text-slate-950 font-black uppercase tracking-wider text-xs rounded-2xl transition-all shadow-lg">
      Lock In Sequence
    </button>
  </main>

  <script src="daily.js"></script>
</body>
</html>
