<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TimeLine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="scanlines flex flex-col h-[100dvh] bg-[#07090e]">

  <header class="border-b border-slate-800/80 p-4 bg-[#0b0f19]/90 backdrop-blur z-40 relative">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <button id="menuBtn" class="w-10 h-10 bg-slate-900 border border-slate-700/80 hover:border-amber-400/50 rounded-xl flex items-center justify-center text-amber-400 font-bold text-lg transition-all shadow-md active:scale-95 z-50">☰</button>
        <h1 class="text-base font-bold tracking-wider text-white">
          TIMELINE <span id="dailyNumberBadge" class="text-amber-400">#--</span>
        </h1>
      </div>
      <div class="bg-amber-500/10 border border-amber-500/30 text-amber-300 px-3 py-1 rounded-xl text-xs font-bold mono">
        🔥 <span id="streakCount">0</span>
      </div>
    </div>
  </header>

  <!-- Ad Space -->
  <div class="w-full bg-[#07090e] py-2 border-b border-slate-800 relative z-30">
    <div class="ad-banner-container">Ad Space (320x50)</div>
  </div>

  <!-- Menu Modal -->
  <div id="menuModal" class="fixed inset-0 z-[100] bg-black/90 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-[#0f1523] border border-slate-700/80 w-full max-w-sm rounded-3xl p-6 space-y-4 shadow-2xl relative">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h2 class="text-lg font-bold tracking-wide text-amber-400">MENU</h2>
        <button id="closeMenuBtn" class="w-8 h-8 bg-slate-800 rounded-xl text-slate-300 font-bold active:scale-95">✕</button>
      </div>
      <div class="grid grid-cols-2 gap-3 py-2">
        <button class="p-4 bg-slate-900/90 border border-slate-800 rounded-2xl text-center active:scale-95 transition-transform" onclick="window.location.href='archive.html'">
          <div class="text-xl mb-1">🗓️</div><div class="text-xs font-bold text-slate-200">Archive</div>
        </button>
        <button class="p-4 bg-slate-900/90 border border-slate-800 rounded-2xl text-center active:scale-95 transition-transform" onclick="window.location.href='party.html'">
          <div class="text-xl mb-1">🎮</div><div class="text-xs font-bold text-slate-200">Party Mode</div>
        </button>
      </div>
    </div>
  </div>

  <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col justify-between relative z-10 overflow-y-auto pb-6">
    
    <!-- GAME 1: TIMELINE -->
    <div id="game1Container" class="flex flex-col flex-1 gap-4 py-2">
      <div class="flex justify-between items-center">
        <span class="text-[11px] font-bold text-amber-400 uppercase tracking-widest">Sort: Oldest ➔ Newest</span>
        <span class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Tap to Swap</span>
      </div>

      <div id="cardPool" class="min-h-[140px] p-3 bg-slate-900/80 border border-slate-800 rounded-2xl flex flex-wrap gap-2 content-start shadow-inner">
        <!-- Cards injected via JS -->
      </div>

      <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Timeline Slots</div>

      <div class="space-y-2" id="slotContainer">
        <!-- Slots injected via JS -->
      </div>
    </div>

    <!-- GAME 2: YEAR LOCK -->
    <div id="game2Container" class="hidden flex-col flex-1 justify-center gap-6 py-4">
      <div class="text-center space-y-2">
        <span class="inline-block bg-cyan-500/10 text-cyan-400 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-widest border border-cyan-500/20">Bonus Challenge</span>
        <h2 class="text-3xl font-black text-white">Year Lock 🎯</h2>
        <p class="text-xs text-slate-400">Guess the exact year this event occurred!</p>
      </div>

      <div class="bg-slate-900/80 p-6 rounded-3xl border border-slate-800 text-center space-y-6 shadow-xl">
        <div id="yearLockEventText" class="text-base font-bold text-cyan-200 leading-snug"></div>
        
        <div class="space-y-3">
          <div id="yearSliderDisplay" class="text-4xl mono font-black text-cyan-400">1950 AD</div>
          <input type="range" id="yearSlider" min="1000" max="2025" value="1950" class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-400">
          <div class="flex justify-between text-xs text-slate-500 mono font-bold">
            <span id="yearLockMin">1000 AD</span>
            <span id="yearLockMax">2025 AD</span>
          </div>
        </div>
      </div>
    </div>

    <!-- SUMMARY SCREEN -->
    <div id="summaryContainer" class="hidden flex-col flex-1 justify-center gap-6 py-4 text-center">
      <div class="space-y-2">
        <span class="text-xs font-bold text-amber-400 uppercase tracking-widest">Daily Complete</span>
        <h2 id="summaryTitle" class="text-4xl font-black text-white">--</h2>
      </div>

      <div class="bg-slate-900/80 border border-slate-800 p-6 rounded-3xl space-y-5 shadow-xl">
        <div>
          <div class="text-xs text-slate-400 uppercase tracking-wider mb-1 font-bold">Timeline Score</div>
          <div class="text-4xl mono font-black text-amber-400" id="finalTimelineScore">0 / 1,000</div>
        </div>
        <div class="border-t border-slate-800 pt-4">
          <div class="text-xs text-slate-400 uppercase tracking-wider mb-1 font-bold">Year Lock Precision</div>
          <div class="text-sm font-semibold text-slate-200" id="finalYearResult">--</div>
        </div>
        <div class="border-t border-slate-800 pt-4">
          <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-1 font-bold">Total Daily Score</div>
          <div class="text-2xl mono font-black text-cyan-400" id="finalTotalScore">0 / 1,500</div>
        </div>
      </div>

      <button id="copyBtn" class="w-full py-4 bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/50 font-black uppercase tracking-wider text-xs rounded-xl shadow-lg transition-all active:scale-95">
        📋 Copy Daily Score
      </button>
    </div>

    <!-- GLOBAL ACTION BUTTON -->
    <button id="actionBtn" disabled class="w-full py-4 mt-6 bg-amber-500 disabled:opacity-30 text-slate-950 font-black uppercase tracking-wider text-xs rounded-xl transition-all shadow-lg active:scale-95">
      Lock In Sequence
    </button>
  </main>

  <script src="daily.js"></script>
</body>
</html>
